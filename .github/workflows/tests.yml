name: CleanTandem — tests de préproduction
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt pytest
      - name: Tests API et isolation des organisations
        env:
          CT_DEV_ALLOW_INSECURE: '1'
        run: python -m pytest backend/tests -q